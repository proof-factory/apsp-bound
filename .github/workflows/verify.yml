name: Verify refined APSP bound

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  complete-apsp:
    name: Complete APSP theorem
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - name: Check out the proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lean and cached Mathlib dependencies
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Build the complete word-RAM proof with bounded parallelism
        run: python3 scripts/build_sequential.py
      - name: Verify the exact statement, source pins, and transitive axioms
        run: python3 verify.py
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apsp-build-${{ github.sha }}
          path: verification/
          if-no-files-found: ignore
